[project]
name = "coursepull"
version = "0.1.0"
description = "A team of LLM agents that collects the study materials of an open online course for offline study."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "yt-dlp>=2026.8.19",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "openai>=1.40",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pypdf[crypto]>=6.20.1",
    "nicegui>=3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real websites; run with --run-network"]
